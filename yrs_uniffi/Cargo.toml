[package]
name = "yrs_uniffi"
version = "0.5.2"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
yrs = { version = "0.28.1", features = ["weak"] }
uniffi = { version = "0.32.2" }
thiserror = "2.0.21"

[build-dependencies]
uniffi = { version = "0.32.2", features = ["build", "cli"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
uniffi = { version = "0.32.2" }
