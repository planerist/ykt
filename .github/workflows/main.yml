name: Main

# Every push to main and every pull request: build and test (Swift, Kotlin).
#
# A release is started by hand — Actions → Main → Run workflow, or
#   gh workflow run main.yml --ref main -f version=x.y.z
# with x.y.z the version in yrs_uniffi/Cargo.toml. After the build, the release job commits the Swift
# package's manifest (Package.swift, its binary target the release's YktFFI.xcframework.zip with its
# checksum) and the generated Swift bindings on top of the built commit, tags that commit vx.y.z (only
# the tag is pushed: main doesn't get the commit) and creates the GitHub release with the JARs and
# the zips. Apps then use .package(url: "https://github.com/<owner>/ykt", from: "x.y.z").
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: "Release this version (x.y.z, as in yrs_uniffi/Cargo.toml); empty: build only"
        required: false
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}

jobs:
  build-yrs_uniffi-macos:
    runs-on: macos-latest
    env:
      # The Swift package's platforms (yrs_swift/Package.swift, swift_release_manifest.sh): the Rust
      # libraries are built for them, so apps don't link objects made for a newer OS.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    steps:
      - name: checkout sources
        uses: actions/checkout@v7

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios, aarch64-apple-ios-macabi, x86_64-apple-ios-macabi

      - name: build libs and Swift bindings
        run: ./build_swift_bindings.sh --all

      - name: test Swift package
        working-directory: yrs_swift
        run: swift test

      - name: package Swift
        run: |
          mkdir -p dist/Ykt
          cp -R yrs_swift/Package.swift yrs_swift/Sources yrs_swift/Tests yrs_swift/YktFFI.xcframework dist/Ykt/
          (cd dist && ditto -c -k --sequesterRsrc --keepParent Ykt ykt-swift.zip)
          # The release manifest's binary target: SwiftPM wants the xcframework at the zip's root.
          (cd yrs_swift && ditto -c -k --sequesterRsrc --keepParent YktFFI.xcframework ../dist/YktFFI.xcframework.zip)

      - name: Upload lib x86_64
        uses: actions/upload-artifact@v7
        with:
          name: uniffi-darwin-x86_64
          path: target/x86_64-apple-darwin/release/libyrs_uniffi.dylib

      - name: Upload lib aarch64
        uses: actions/upload-artifact@v7
        with:
          name: uniffi-darwin-aarch64
          path: target/aarch64-apple-darwin/release/libyrs_uniffi.dylib

      - name: Upload Swift package
        uses: actions/upload-artifact@v7
        with:
          name: ykt-swift
          path: dist/ykt-swift.zip

      - name: Upload xcframework
        uses: actions/upload-artifact@v7
        with:
          name: ykt-xcframework
          path: dist/YktFFI.xcframework.zip

      - name: Upload Swift bindings
        uses: actions/upload-artifact@v7
        with:
          name: ykt-swift-bindings
          path: yrs_swift/Sources/Ykt/Ykt.swift


  build-yrs_uniffi-linux:
    runs-on: ubuntu-latest
    steps:
      - name: checkout sources
        uses: actions/checkout@v7

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: build
        run: cargo build --release -p yrs_uniffi

      - name: test
        run: cargo test -p yrs_uniffi

      - name: export kotlin uniffi
        run: cargo run --release --features=uniffi/cli --bin uniffi-bindgen generate --language kotlin --out-dir yrs_kt/src/main/kotlin --library target/release/libyrs_uniffi.so

      - name: Upload lib
        uses: actions/upload-artifact@v7
        with:
          name: uniffi-linux
          path: target/release/libyrs_uniffi.so

      - name: Upload kotlin uniffi
        uses: actions/upload-artifact@v7
        with:
          name: kt-uniffi
          path: yrs_kt/src/main/kotlin/com/planerist/ykt/yrs_uniffi.kt

  build-yrs_kt:
    runs-on: ubuntu-latest
    needs: [build-yrs_uniffi-linux, build-yrs_uniffi-macos]
    steps:
      - name: checkout sources
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: kt-uniffi
          path: yrs_kt/src/main/kotlin/com/planerist/ykt/

      - uses: actions/download-artifact@v8
        with:
          name: uniffi-linux
          path: yrs_kt/src/main/resources/linux-x86-64/

      - uses: actions/download-artifact@v8
        with:
          name: uniffi-darwin-x86_64
          path: yrs_kt/src/main/resources/darwin-x86-64/

      - uses: actions/download-artifact@v8
        with:
          name: uniffi-darwin-aarch64
          path: yrs_kt/src/main/resources/darwin-aarch64/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build y_kt
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            VERSION_ARG="-Pykt.version=$RELEASE_VERSION"
          fi
          ./gradlew build kotlinSourcesJar ${VERSION_ARG:+"$VERSION_ARG"}

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: ykt
          path: yrs_kt/build/libs

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    runs-on: ubuntu-latest
    needs: [build-yrs_kt, build-yrs_uniffi-macos]
    concurrency: release
    permissions:
      contents: write
    steps:
      - name: checkout sources (the built commit, with tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: check the version
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a version (x.y.z): $RELEASE_VERSION"; exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::releases are made from main, not $GITHUB_REF"; exit 1
          fi
          CARGO_VERSION=$(grep -m1 '^version' yrs_uniffi/Cargo.toml | cut -d'"' -f2)
          if [[ "$CARGO_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "::error::yrs_uniffi/Cargo.toml says $CARGO_VERSION, not $RELEASE_VERSION"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$RELEASE_VERSION" >/dev/null; then
            echo "::error::tag v$RELEASE_VERSION exists already"; exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: ykt
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: ykt-swift
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: ykt-xcframework
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: ykt-swift-bindings
          path: yrs_swift/Sources/Ykt/

      - name: tag a commit with the Swift package's manifest
        run: |
          TAG="v$RELEASE_VERSION"
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/YktFFI.xcframework.zip"
          CHECKSUM=$(sha256sum dist/YktFFI.xcframework.zip | cut -d' ' -f1)
          ./swift_release_manifest.sh "$URL" "$CHECKSUM" > Package.swift
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git add -f yrs_swift/Sources/Ykt/Ykt.swift
          git commit -m "Release $TAG: Swift package manifest and bindings"
          git tag -a "$TAG" -m "ykt $RELEASE_VERSION"
          git push origin "refs/tags/$TAG"
          echo "SwiftPM checksum of YktFFI.xcframework.zip: $CHECKSUM" >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv dist/ykt-swift.zip "dist/ykt-swift-$RELEASE_VERSION.zip"
          gh release create "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "v$RELEASE_VERSION" --generate-notes dist/*
